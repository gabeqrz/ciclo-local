<body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header>
        <a class="logo" href="./index.html" aria-label="CicloLocal, página inicial">
        <img src="./img/cicloLocal-simbolo.svg" alt="" width="34" height="34"><span>Ciclo<b>Local</b></span>
        </a>
    </header>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="./index.html">Início</a></li>
            <li><a href="./selecao-de-perfil.html">Perfil</a></li>
            <li><a href="./perfil-coletor.html" aria-current="page">Coletas</a></li>
            <li><a href="./dashboard.html">Resultados</a></li>
        </ul>
    </nav>
    <main id="conteudo" tabindex="-1">
        <a href="./selecao-de-perfil.html">Voltar</a>
        <p>Modo demonstração</p>

        <h1>Coletas perto de você</h1>

        <section aria-labelledby="t-local">
            <h2 id="t-local">…</h2>
            <p><span id="cidade-atual">São Paulo - SP</span></p>
            <button type="button" id="trocar-cidade">Trocar cidade</button>
            <p class="aviso" id="aviso-local" role="status"></p>
            <p class="rotulo" id="t-bairro">Bairro</p>
            <div role="group" aria-labelledby="t-bairro" id="filtro-bairro"></div>
            <div id="outro-bairro" hidden></div>
        </section>

        <section aria-labelledby="t-lista">
            <h2 id="t-lista">…</h2>
            <p id="sem-pedidos" hidden></p>
            <div id="lista-pedidos"></div>   <!-- apague os cards fixos -->
        </section>

        <p>O endereço completo aparece depois que você aceita a coleta.</p>
    </main>
    <div class="barra-aceite" id="barra-aceite" hidden>
        <p id="resumo-aceites" role="status"></p>
        <a class="botao" href="./confirmacao-coletor.html">Ver coletas aceitas</a>
    </div>
    
<script type="module" src="./js/perfil-coletor.js"></script>
