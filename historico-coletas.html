  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="./tokens.css">

<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header>
    <a class="logo" href="./index.html" aria-label="CicloLocal, página inicial">
      <img src="./img/cicloLocal-simbolo.svg" alt="" width="34" height="34"><span>Ciclo<b>Local</b></span>
    </a>
  </header>

  <nav aria-label="Menu principal">
    <ul>
      <li><a href="./index.html">Início</a></li>
      <li><a href="./selecao-de-perfil.html">Perfil</a></li>
      <li><a href="./perfil-coletor.html" aria-current="true">Coletas</a></li>
      <li><a href="./dashboard.html">Resultados</a></li>
    </ul>
  </nav>

  <main id="conteudo" tabindex="-1">
    <a href="./confirmacao-coletor.html">Voltar</a>
    <p>Modo demonstração</p>
    <h1>Coletas anteriores</h1>

    <section aria-labelledby="t-filtros">
      <h2 id="t-filtros">Filtrar entregas</h2>
      <div class="filtros-historico">
        <div>
          <label for="filtro-mes">Mês</label>
          <select id="filtro-mes">
            <option value="">Todos os meses</option>
          </select>
        </div>
        <div>
          <label for="filtro-bairro-hist">Bairro</label>
          <select id="filtro-bairro-hist">
            <option value="">Todos os bairros</option>
          </select>
        </div>
      </div>
    </section>

    <section aria-labelledby="t-resumo">
      <h2 id="t-resumo">Resumo</h2>
      <ul class="resumo-historico" id="resumo-historico"></ul>
    </section>

    <section aria-labelledby="t-entregas">
      <h2 id="t-entregas">Entregas concluídas</h2>
      <p class="escopo" id="status-historico" role="status" tabindex="-1"></p>
      <p id="sem-historico" hidden></p>
      <div id="lista-historico"></div>
      <button type="button" id="mais-historico" hidden>Mostrar mais</button>
    </section>
  </main>

  <script type="module" src="./js/historico-coletas.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>

</html>
